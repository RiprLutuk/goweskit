<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%" fill="none">
  <!-- Background Card Accent -->
  <rect width="240" height="160" rx="20" fill="#F8FAFC"/>
  
  <!-- Knobby 29er MTB Tires & Wheels -->
  <circle cx="45" cy="105" r="40" stroke="#17202A" stroke-width="6" fill="#FFFFFF"/>
  <circle cx="45" cy="105" r="30" stroke="#EDE4D2" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="45" cy="105" r="7" fill="#17202A"/>
  
  <circle cx="195" cy="105" r="40" stroke="#17202A" stroke-width="6" fill="#FFFFFF"/>
  <circle cx="195" cy="105" r="30" stroke="#EDE4D2" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="195" cy="105" r="7" fill="#17202A"/>

  <!-- Slack Hardtail Frame Geometry -->
  <!-- Rear triangle -->
  <path d="M45 105 L96 68 L110 110 Z" stroke="#17202A" stroke-width="5" stroke-linejoin="round"/>
  <!-- Front triangle -->
  <path d="M110 110 L96 68 L160 55 L168 85 Z" stroke="#17202A" stroke-width="5" stroke-linejoin="round" fill="#C9F36A" fill-opacity="0.2"/>
  
  <!-- Sloping Top Tube -->
  <path d="M96 68 L160 55" stroke="#17202A" stroke-width="6" stroke-linecap="round"/>
  <!-- Heavy Down Tube -->
  <path d="M110 110 L168 85" stroke="#17202A" stroke-width="6" stroke-linecap="round"/>

  <!-- BB & 1x12 Chainring -->
  <circle cx="110" cy="110" r="13" fill="#17202A"/>
  <circle cx="110" cy="110" r="8" fill="#C9F36A"/>

  <!-- Dropper Post & MTB Saddle -->
  <path d="M110 110 L90 50" stroke="#17202A" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M72 48 C85 44, 102 44, 114 48 C108 52, 85 52, 72 48 Z" fill="#17202A"/>
  
  <!-- Front Suspension Fork (Stanchions + Lower Legs) -->
  <!-- Crown / Headtube -->
  <path d="M160 55 L168 85" stroke="#17202A" stroke-width="7" stroke-linecap="round"/>
  <!-- Gold Stanchions -->
  <path d="M165 78 L178 92" stroke="#EAB308" stroke-width="4" stroke-linecap="round"/>
  <!-- Fork Lower Leg to Axle -->
  <path d="M175 88 L195 105" stroke="#17202A" stroke-width="6" stroke-linecap="round"/>

  <!-- Stem & Wide Flat Handlebar -->
  <path d="M160 55 L156 42" stroke="#17202A" stroke-width="5" stroke-linecap="round"/>
  <path d="M142 40 L170 44" stroke="#17202A" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Badge Label -->
  <rect x="12" y="12" width="75" height="20" rx="6" fill="#16A34A"/>
  <text x="49" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">HARDTAIL</text>
</svg>
