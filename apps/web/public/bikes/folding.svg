<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%" fill="none">
  <!-- Background Card Accent -->
  <rect width="240" height="160" rx="20" fill="#F8FAFC"/>
  
  <!-- Wheels (ISO 406 20") -->
  <circle cx="50" cy="115" r="28" stroke="#17202A" stroke-width="4" fill="#FFFFFF"/>
  <circle cx="50" cy="115" r="22" stroke="#EDE4D2" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="50" cy="115" r="5" fill="#17202A"/>
  
  <circle cx="190" cy="115" r="28" stroke="#17202A" stroke-width="4" fill="#FFFFFF"/>
  <circle cx="190" cy="115" r="22" stroke="#EDE4D2" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="190" cy="115" r="5" fill="#17202A"/>

  <!-- Low Main Beam Frame with Center Hinge -->
  <path d="M50 115 L80 85 L120 90 L160 85 L190 115" stroke="#17202A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chainstay & Bottom Bracket -->
  <path d="M50 115 L115 115" stroke="#17202A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="115" cy="115" r="10" fill="#C9F36A" stroke="#17202A" stroke-width="3"/>
  
  <!-- Folding Hinge Clasp Highlight -->
  <rect x="114" y="83" width="12" height="14" rx="3" fill="#C9F36A" stroke="#17202A" stroke-width="2"/>

  <!-- Long Telescopic Seatpost & Saddle -->
  <path d="M115 115 L102 45" stroke="#17202A" stroke-width="4" stroke-linecap="round"/>
  <!-- Saddle -->
  <path d="M85 45 C95 40, 115 40, 125 45 C120 48, 95 48, 85 45 Z" fill="#17202A"/>
  
  <!-- Tall Folding Handlepost & Flat Bar -->
  <path d="M160 85 L150 35" stroke="#17202A" stroke-width="4" stroke-linecap="round"/>
  <path d="M140 35 L160 35" stroke="#17202A" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Front Fork -->
  <path d="M160 85 L190 115" stroke="#8EDDF4" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Badge Label -->
  <rect x="12" y="12" width="62" height="20" rx="6" fill="#C9F36A"/>
  <text x="43" y="26" fill="#17202A" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">FOLDING</text>
</svg>
