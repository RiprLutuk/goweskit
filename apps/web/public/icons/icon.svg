<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17202a" />
      <stop offset="100%" stop-color="#0f151c" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9f36a" />
      <stop offset="100%" stop-color="#aee642" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#c9f36a" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="160" cy="330" r="90" fill="none" stroke="#2a3847" stroke-width="6" stroke-dasharray="8 8" />
  <circle cx="352" cy="330" r="90" fill="none" stroke="#2a3847" stroke-width="6" stroke-dasharray="8 8" />
  
  <!-- Bicycle Wheels -->
  <circle cx="160" cy="330" r="76" fill="none" stroke="#8eddf4" stroke-width="18" />
  <circle cx="160" cy="330" r="14" fill="#c9f36a" />
  
  <circle cx="352" cy="330" r="76" fill="none" stroke="#8eddf4" stroke-width="18" />
  <circle cx="352" cy="330" r="14" fill="#c9f36a" />
  
  <!-- Bike Frame Geometry (Diamond Hardtail / Commuter) -->
  <!-- Bottom Bracket to Rear Dropouts, Seat Tube, Top Tube, Down Tube, Fork -->
  <g filter="url(#glow)">
    <!-- Rear Triangle -->
    <path d="M 160 330 L 260 330 L 220 200 Z" fill="none" stroke="url(#limeGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Front Triangle -->
    <path d="M 260 330 L 330 200 L 220 200" fill="none" stroke="url(#limeGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Fork to Front Wheel -->
    <path d="M 330 200 L 352 330" fill="none" stroke="url(#limeGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Handlebar Stem & Bar -->
    <path d="M 330 200 L 325 155 M 305 155 L 360 155" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Seatpost & Saddle -->
    <path d="M 220 200 L 210 160 M 180 160 L 235 160" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chainring Accent -->
    <circle cx="260" cy="330" r="24" fill="#c9f36a" stroke="#17202a" stroke-width="6" />
  </g>
</svg>
