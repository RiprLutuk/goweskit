services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: goweskit
      POSTGRES_USER: lutuk
      POSTGRES_PASSWORD: ''
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '1921:5432'
    volumes:
      - goweskit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lutuk -d goweskit']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  goweskit_pgdata:
